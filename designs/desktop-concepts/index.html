<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparrow — theatre &amp; guide casts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #09080c;
      --slate: #16141c;
      --key: #221f2a;
      --key-on: #f4efe6;
      --ink: #efeae1;
      --dim: #9b9488;
      --line: rgba(244, 239, 230, 0.12);
      --gold: #e0b15a;
      --cast1: #c9a36a;
      --cast2: #3ec8ff;
      --cast3: #8ea4c4;
      --cast4: #e85d75;
      --cast5: #e8b84a;
      --cast6: #ff4d3a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: "Public Sans", sans-serif;
      overflow: hidden;
    }

    body {
      display: block;
    }

    .stage {
      position: relative;
      height: 100%;
      background: #000;
    }

    .stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .remote {
      position: absolute;
      z-index: 4;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 12px 18px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent 42%),
        rgba(22, 20, 28, 0.92);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }

    body.chrome-off .remote {
      display: none;
    }

    .ident {
      min-width: 0;
    }

    .ident p {
      margin: 0 0 2px;
      color: var(--gold);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .ident h1 {
      margin: 0;
      font-family: Syne, sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .ident span {
      display: block;
      margin-top: 4px;
      color: var(--dim);
      font-size: 0.72rem;
    }

    .keys {
      display: flex;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .keys button {
      appearance: none;
      flex: 1 1 0;
      min-width: 108px;
      margin: 0;
      padding: 8px 10px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--key);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .keys button:hover {
      transform: translateY(-1px);
      border-color: rgba(244, 239, 230, 0.28);
    }

    .keys button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .keys button[aria-current="true"] {
      background: var(--key-on);
      color: #16130e;
      border-color: transparent;
    }

    .keys kbd {
      display: block;
      font-family: inherit;
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      opacity: 0.55;
    }

    .keys strong {
      display: block;
      margin-top: 2px;
      font-family: Syne, sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .keys em {
      display: block;
      margin-top: 3px;
      font-style: normal;
      font-size: 0.62rem;
      opacity: 0.7;
      white-space: nowrap;
    }

    .keys button[aria-current="true"] kbd,
    .keys button[aria-current="true"] em {
      opacity: 0.55;
      color: inherit;
    }

    .keys button[data-cast="1"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast1); }
    .keys button[data-cast="2"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast2); }
    .keys button[data-cast="3"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast3); }
    .keys button[data-cast="4"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast4); }
    .keys button[data-cast="5"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast5); }
    .keys button[data-cast="6"][aria-current="true"] { box-shadow: inset 0 0 0 2px var(--cast6); }

    .hint {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      color: var(--dim);
      font-size: 0.68rem;
      white-space: nowrap;
    }

    .hint button {
      appearance: none;
      margin: 0;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .hint button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .peek {
      display: none;
      position: absolute;
      z-index: 5;
      right: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(22, 20, 28, 0.88);
      color: var(--ink);
      font: 600 0.72rem/1 "Public Sans", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    body.chrome-off .peek {
      display: block;
    }

    .peek:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    @media (max-width: 980px) {
      .remote {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .hint {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <iframe id="cast" title="Sparrow desktop concept" src="10-split-stage.html"></iframe>
    <button class="peek" type="button" id="show-chrome">Show remote · H</button>
  </div>

  <nav class="remote" aria-label="Desktop concept remote">
    <div class="ident">
      <p>Selected direction</p>
      <h1>Split Stage</h1>
      <span id="now-playing">6 · Split Stage — cinema left, timetable right</span>
    </div>
    <div class="keys" role="list">
      <button type="button" data-cast="1">
        <kbd>1</kbd>
        <strong>Night Theatre</strong>
        <em>Original · cinema</em>
      </button>
      <button type="button" data-cast="2">
        <kbd>2</kbd>
        <strong>Night Grid</strong>
        <em>Original · EPG</em>
      </button>
      <button type="button" data-cast="3">
        <kbd>3</kbd>
        <strong>Platinum House</strong>
        <em>From 1 · one picture</em>
      </button>
      <button type="button" data-cast="4">
        <kbd>4</kbd>
        <strong>Billboard</strong>
        <em>From 1 · posters</em>
      </button>
      <button type="button" data-cast="5">
        <kbd>5</kbd>
        <strong>Amber Guide</strong>
        <em>From 2 · lamplight</em>
      </button>
      <button type="button" data-cast="6" aria-current="true">
        <kbd>6</kbd>
        <strong>Split Stage</strong>
        <em>Chosen · 1 + 2</em>
      </button>
    </div>
    <div class="hint">
      <span>Keys 1–6 · [ ] · H hides this bar</span>
      <button type="button" id="hide-chrome">Hide remote</button>
    </div>
  </nav>

  <script>
    const casts = {
      1: {
        src: "01-cinematic.html",
        line: "1 · Night Theatre — original cinematic shelves",
      },
      2: {
        src: "02-broadcast-guide.html",
        line: "2 · Night Grid — original electronic programme guide",
      },
      3: {
        src: "07-platinum.html",
        line: "3 · Platinum House — one cool picture, one filmstrip",
      },
      4: {
        src: "08-billboard.html",
        line: "4 · Billboard — iPlayer cover + portrait wall",
      },
      5: {
        src: "09-amber-guide.html",
        line: "5 · Amber Guide — lamplight EPG with a honey ribbon",
      },
      6: {
        src: "10-split-stage.html",
        line: "6 · Split Stage — cinema left, timetable right",
      },
    };

    const frame = document.getElementById("cast");
    const line = document.getElementById("now-playing");
    const keys = [...document.querySelectorAll(".keys button")];
    let current = 6;

    function show(id) {
      const cast = casts[id];
      if (!cast) return;
      current = id;
      frame.src = cast.src;
      line.textContent = cast.line;
      keys.forEach((button) => {
        const on = Number(button.dataset.cast) === id;
        button.setAttribute("aria-current", on ? "true" : "false");
      });
      history.replaceState(null, "", "#" + String(id).padStart(2, "0"));
    }

    function setChrome(hidden) {
      document.body.classList.toggle("chrome-off", hidden);
      document.getElementById("show-chrome").hidden = !hidden;
    }

    keys.forEach((button) => {
      button.addEventListener("click", () => show(Number(button.dataset.cast)));
    });

    document.getElementById("hide-chrome").addEventListener("click", () => setChrome(true));
    document.getElementById("show-chrome").addEventListener("click", () => setChrome(false));

    window.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.target && /^(INPUT|TEXTAREA)$/.test(event.target.tagName)) return;
      if (event.key >= "1" && event.key <= "6") {
        event.preventDefault();
        show(Number(event.key));
        return;
      }
      if (event.key === "[" || event.key === "ArrowLeft") {
        event.preventDefault();
        show(current === 1 ? 6 : current - 1);
        return;
      }
      if (event.key === "]" || event.key === "ArrowRight") {
        event.preventDefault();
        show(current === 6 ? 1 : current + 1);
        return;
      }
      if (event.key.toLowerCase() === "h") {
        event.preventDefault();
        setChrome(!document.body.classList.contains("chrome-off"));
      }
    });

    const fromHash = Number((location.hash.match(/\d+/) || [])[0]);
    if (fromHash >= 1 && fromHash <= 6) show(fromHash);
  </script>
</body>
</html>
