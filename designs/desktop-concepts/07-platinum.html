<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparrow — Platinum House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500;1,6..96,600;1,6..96,700&family=Commissioner:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090c;
      --surface: #14161c;
      --platinum: #d7dbe6;
      --ice: #8ea4c4;
      --live: #5ee0c0;
      --text: #f4f5f8;
      --muted: #8b909c;
      --hair: rgba(215, 219, 230, 0.18);
      --hair-soft: rgba(215, 219, 230, 0.08);
      --serif: "Bodoni Moda", "Didot", "Palatino Linotype", Palatino, serif;
      --sans: "Commissioner", "Avenir Next", "Segoe UI", sans-serif;
      --bar: 48px;
      --strip: 22vh;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      color-scheme: dark;
    }

    body {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--ice);
      color: var(--bg);
    }

    button, input {
      font-family: inherit;
      color: inherit;
      background: none;
      border: 0;
    }

    button { cursor: pointer; }

    :focus { outline: none; }

    :focus-visible {
      outline: 1px solid var(--platinum);
      outline-offset: 3px;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 80;
      opacity: 0.055;
      mix-blend-mode: overlay;
    }

    .grain svg { width: 100%; height: 100%; display: block; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background:
        radial-gradient(ellipse at 50% 36%, transparent 32%, rgba(8, 9, 12, 0.38) 72%, rgba(8, 9, 12, 0.82) 100%);
    }

    [hidden] { display: none !important; }

    .house {
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-rows: var(--bar) 1fr var(--strip);
      grid-template-columns: minmax(0, 1fr);
      position: relative;
      overflow: hidden;
    }

    .bar, .picture, .strip { min-width: 0; }

    .bar {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 40px;
      animation: rise 0.9s ease both;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .wordmark {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.16em;
      line-height: 1;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transform: translateY(-1px);
    }

    .live i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 8px rgba(94, 224, 192, 0.55);
      animation: pulse 2.8s ease-in-out infinite;
    }

    .live span {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--live);
    }

    .fresh {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .fresh b {
      font-weight: 500;
      color: var(--platinum);
    }

    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 28px;
    }

    .nav button {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav button:hover {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .picture {
      position: relative;
      min-height: 0;
      overflow: hidden;
      animation: rise 1.05s ease 0.06s both;
    }

    .still {
      position: absolute;
      top: calc(var(--bar) * -1);
      left: 0;
      right: 0;
      bottom: 0;
      transform-origin: 62% 38%;
      animation: drift 48s ease-in-out infinite alternate;
    }

    .wash {
      position: absolute;
      inset: -8%;
    }

    .city, .windows, .horizon, .glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .city {
      background:
        radial-gradient(ellipse 58% 34% at 74% 16%, rgba(142, 164, 196, 0.26), transparent 68%),
        radial-gradient(ellipse 32% 22% at 28% 10%, rgba(215, 219, 230, 0.09), transparent 62%),
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(8, 9, 12, 0.55), transparent 58%);
    }

    .windows {
      bottom: 0;
      top: auto;
      height: 52%;
      opacity: 0.5;
      background:
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(215, 219, 230, 0.12) 11px 12px, transparent 12px 24px),
        repeating-linear-gradient(0deg, transparent 0 8px, rgba(142, 164, 196, 0.09) 8px 9px, transparent 9px 22px);
      mask-image: linear-gradient(180deg, transparent, #000 28%, #000 68%, transparent 100%);
      animation: drift-windows 62s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    .horizon {
      background:
        linear-gradient(180deg, transparent 54%, rgba(142, 164, 196, 0.1) 61%, transparent 68%),
        linear-gradient(90deg,
          transparent 0%,
          rgba(20, 22, 28, 0.55) 6%,
          rgba(20, 22, 28, 0.55) 11%,
          transparent 11.2%,
          transparent 18%,
          rgba(12, 14, 20, 0.7) 18%,
          rgba(12, 14, 20, 0.7) 27%,
          transparent 27.2%,
          transparent 34%,
          rgba(16, 18, 26, 0.6) 34%,
          rgba(16, 18, 26, 0.6) 39%,
          transparent 39.2%,
          transparent 48%,
          rgba(10, 12, 18, 0.75) 48%,
          rgba(10, 12, 18, 0.75) 58%,
          transparent 58.2%,
          transparent 66%,
          rgba(18, 22, 30, 0.5) 66%,
          rgba(18, 22, 30, 0.5) 71%,
          transparent 71.2%,
          transparent 78%,
          rgba(12, 14, 22, 0.65) 78%,
          rgba(12, 14, 22, 0.65) 86%,
          transparent 86.2%);
      background-size: 100% 100%, 100% 44%;
      background-position: 0 0, 0 100%;
      background-repeat: no-repeat;
    }

    .glass {
      background: linear-gradient(108deg, transparent 38%, rgba(215, 219, 230, 0.045) 49%, transparent 61%);
      animation: sheen 22s ease-in-out infinite;
    }

    .picture.is-held .still {
      animation-play-state: paused;
      filter: saturate(0.62) brightness(0.7);
    }

    .picture.is-held .windows,
    .picture.is-held .glass { animation-play-state: paused; }

    .picture.is-cut .still { animation: cut 0.55s ease; }

    .copy {
      position: absolute;
      z-index: 3;
      left: 48px;
      bottom: 36px;
      max-width: min(640px, 52vw);
      animation: rise 1.1s ease 0.14s both;
    }

    .channel {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--ice);
      margin-bottom: 10px;
    }

    .programme {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(44px, 6.6vw, 96px);
      line-height: 0.9;
      letter-spacing: -0.025em;
      color: var(--text);
      max-width: 12ch;
    }

    .next {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .next em {
      font-family: var(--serif);
      font-style: italic;
      color: var(--platinum);
      letter-spacing: 0;
    }

    .meter {
      margin-top: 22px;
      width: min(320px, 40vw);
      height: 1px;
      background: var(--hair);
      position: relative;
    }

    .meter i {
      position: absolute;
      left: 0;
      top: 0;
      height: 1px;
      background: var(--ice);
    }

    .meter i::after {
      content: "";
      position: absolute;
      right: -2px;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--live);
      transform: translateY(-50%);
    }

    .remain {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .words {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
    }

    .word {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .word:hover {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
      transform: scale(1.04);
    }

    .word.is-on {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .tonight {
      position: absolute;
      z-index: 3;
      right: 48px;
      bottom: 36px;
      list-style: none;
      padding: 8px 0 8px 18px;
      border-left: 1px solid var(--hair);
      background: linear-gradient(90deg, transparent, rgba(8, 9, 12, 0.28));
      animation: fade 1.15s ease 0.2s both;
    }

    .tonight li {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: baseline;
      padding: 7px 0;
      font-size: 12px;
      color: var(--muted);
    }

    .tonight time {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    .tonight b {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 16px;
      color: var(--muted);
    }

    .tonight li.is-now {
      color: var(--platinum);
    }

    .tonight li.is-now b { color: var(--text); }

    .tonight .now {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--live);
    }

    .strip {
      position: relative;
      z-index: 12;
      border-top: 1px solid var(--hair);
      background: linear-gradient(180deg, rgba(8, 9, 12, 0.35) 0%, var(--bg) 32%);
      display: flex;
      flex-direction: column;
      min-height: 0;
      animation: rise 1s ease 0.16s both;
    }

    .chips {
      position: absolute;
      top: 0;
      left: 48px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 14;
      padding: 0 4px;
      background: var(--bg);
    }

    .chip {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: var(--muted);
      padding: 4px 10px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .chip small {
      margin-left: 7px;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--ice);
    }

    .chip:hover {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
      transform: scale(1.04);
    }

    .chip.is-on {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .film {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      padding: 28px 48px 18px;
      scrollbar-width: none;
      flex: 1;
      align-items: flex-end;
      min-width: 0;
      width: 100%;
      overscroll-behavior-x: contain;
    }

    .film::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 220px;
      scroll-snap-align: start;
      text-align: left;
      transition: transform 0.28s ease;
    }

    .card:hover { transform: scale(1.035); }

    .card.is-selected {
      transform: scale(1.06);
    }

    .thumb {
      height: 118px;
      border: 1px solid var(--hair-soft);
      position: relative;
      overflow: hidden;
    }

    .card.is-selected .thumb {
      border-color: var(--platinum);
    }

    .thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 70% 30%, var(--c2), transparent 62%),
        linear-gradient(128deg, var(--c1) 0%, var(--c2) 48%, var(--c3) 100%);
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px 2px 0;
    }

    .card-ch {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid transparent;
      align-self: start;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .card:hover .card-ch,
    .card.is-selected .card-ch {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .card-now {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      display: none;
      align-self: center;
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted);
      font-size: 18px;
      padding: 0 48px 12px;
    }

    .empty.is-on { display: block; }

    .veil {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.45);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }

    .veil.is-on {
      opacity: 1;
      pointer-events: auto;
    }

    .spot {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 10vh 12vw 8vh;
      background:
        radial-gradient(ellipse 64% 52% at 50% 28%, rgba(20, 22, 28, 0.42), rgba(8, 9, 12, 0.88) 72%);
      opacity: 0;
      pointer-events: none;
      transform: scale(1.015);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    .spot.is-on {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .spot-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--hair);
    }

    .spot-top label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .spot-top input {
      width: min(640px, 56vw);
      font-family: var(--serif);
      font-style: italic;
      font-size: 42px;
      font-weight: 500;
      line-height: 1.1;
      caret-color: var(--live);
    }

    .spot-top input::-webkit-search-decoration,
    .spot-top input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .spot-top input::placeholder { color: rgba(139, 144, 156, 0.45); }

    .esc {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--muted);
      padding-bottom: 10px;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0 48px;
      margin-top: 36px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .rule { background: var(--hair); }

    .col h3 {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .hit {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      padding: 12px 0;
      border-bottom: 1px solid var(--hair-soft);
      text-align: left;
    }

    .hit-name {
      font-family: var(--serif);
      font-style: italic;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.1;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .hit:hover .hit-name,
    .hit:focus-visible .hit-name {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .hit-meta {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .none {
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted);
      font-size: 18px;
      padding-top: 8px;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 55;
      background: var(--surface);
      border-top: 1px solid var(--hair);
      padding: 32px 48px 28px;
      transform: translateY(104%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      display: grid;
      grid-template-columns: minmax(180px, 240px) 1fr auto;
      gap: 40px;
      align-items: start;
    }

    .sheet.is-on { transform: none; }

    .sheet h2 {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 36px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .sheet-lead {
      font-size: 12px;
      color: var(--muted);
      max-width: 22ch;
      line-height: 1.45;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .field span {
      display: block;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ice);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      font-size: 13px;
      letter-spacing: 0.02em;
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--hair);
      color: var(--text);
    }

    .field input:focus { border-bottom-color: var(--platinum); }

    .sheet-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 22px;
      min-width: 220px;
    }

    .acts {
      display: flex;
      gap: 24px;
    }

    .act {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .act:hover {
      color: var(--platinum);
      border-bottom-color: var(--platinum);
    }

    .status {
      display: grid;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--hair);
      width: 100%;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .status-row b {
      font-weight: 500;
      color: var(--text);
    }

    .status-row b em {
      font-style: normal;
      color: var(--live);
      margin-right: 8px;
      letter-spacing: 0.18em;
    }

    @keyframes drift {
      from { transform: scale(1.02) translate(0, 0); }
      to { transform: scale(1.1) translate(-1.8%, -1.2%); }
    }

    @keyframes drift-windows {
      from { transform: translate(0, 0); }
      to { transform: translate(-2.4%, -1.6%); }
    }

    @keyframes sheen {
      0%, 100% { opacity: 0.35; transform: translateX(0); }
      50% { opacity: 0.7; transform: translateX(3%); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.28; }
    }

    @keyframes cut {
      0% { filter: brightness(1); }
      35% { filter: brightness(0.55); }
      100% { filter: brightness(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .still, .windows, .glass, .live i { animation: none; }
      .bar, .picture, .copy, .tonight, .strip { animation: none; }
      .spot, .sheet, .veil, .card, .word, .chip, .act, .hit-name, .nav button {
        transition: none;
      }
      .picture.is-cut .still { animation: none; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <filter id="silver">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#silver)"></rect>
    </svg>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="house">
    <header class="bar">
      <div class="brand">
        <div class="wordmark">SPARROW</div>
        <div class="live" title="On air">
          <i aria-hidden="true"></i>
          <span>LIVE</span>
        </div>
      </div>
      <div class="fresh">Guide · <b>12m</b></div>
      <div class="nav">
        <button type="button" id="open-search">Search</button>
        <button type="button" id="open-sources">Sources</button>
      </div>
    </header>

    <section class="picture" id="picture" aria-label="Now playing">
      <div class="still" id="still">
        <div class="wash" id="wash"></div>
        <div class="city"></div>

        schedule: [

    const FINLAND = ["ch01", "ch02", "ch03", "ch04", "ch05", "ch06", "ch07", "ch08", "ch09", "ch10", "ch11", "ch12"];

    const SEARCH_CH = [
      { id: "ch07", name: "Yle TV1 HD", meta: "Finland · News" },
      { id: "cnn", name: "CNN International", meta: "News" },
      { id: "bbc", name: "BBC World News", meta: "News" },
      { id: "ch08", name: "Yle TV2 HD", meta: "Finland · Sports" },
      { id: "ch01", name: "Hero HD FI", meta: "Finland · 4K" },
      { id: "ch04", name: "MTV3 HD FI", meta: "Finland" }
    ];

    const SEARCH_PG = [
      { id: "ch07", name: "Yle Uutiset", meta: "Yle TV1 HD · 20:00 · News" },
      { id: "ch07", name: "A-studio", meta: "Yle TV1 HD · 21:00 · News" },
      { id: "ch07", name: "Oddasat", meta: "Yle TV1 HD · 21:45" },
      { id: "bbc", name: "BBC News", meta: "BBC World News · 21:00" },
      { id: "cnn", name: "CNN Newsroom", meta: "CNN International · 21:00" }
    ];

    const els = {
      picture: document.getElementById("picture"),
      wash: document.getElementById("wash"),
      channel: document.getElementById("channel"),
      programme: document.getElementById("programme"),
      next: document.getElementById("next"),
      meter: document.getElementById("meter"),
      remain: document.getElementById("remain"),
      tonight: document.getElementById("tonight"),
      film: document.getElementById("film"),
      empty: document.getElementById("empty"),
      spot: document.getElementById("spot"),
      sheet: document.getElementById("sheet"),
      veil: document.getElementById("veil"),
      q: document.getElementById("q"),
      hitsCh: document.getElementById("hits-ch"),
      hitsPg: document.getElementById("hits-pg"),
      play: document.getElementById("btn-play"),
      stop: document.getElementById("btn-stop")
    };

    let selected = "ch07";
    let playing = true;
    let group = "finland";
    let lastFocus = null;

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function idsForGroup() {
      if (group === "all" || group === "finland") return FINLAND.slice();
      return Object.keys(CHANNELS).filter((id) => CHANNELS[id].groups.includes(group));
    }

    function cardHTML(ch) {
      const [c1, c2, c3] = ch.still;
      const on = ch.id === selected;
      return `<button class="card${on ? " is-selected" : ""}" type="button" data-id="${ch.id}" aria-current="${on ? "true" : "false"}">
        <div class="thumb" style="--c1:${c1};--c2:${c2};--c3:${c3}"></div>
        <div class="card-meta">
          <span class="card-ch">${ch.code} · ${ch.name}</span>
          <span class="card-now">${ch.now}</span>
        </div>
      </button>`;
    }

    function paintStrip() {
      const ids = idsForGroup();
      els.empty.classList.toggle("is-on", ids.length === 0);
      els.film.hidden = ids.length === 0;
      els.film.innerHTML = ids.map((id) => cardHTML(CHANNELS[id])).join("");
    }

    function paintTonight(ch) {
      els.tonight.innerHTML = ch.schedule.map((s) =>
        `<li class="${s.now ? "is-now" : ""}"><time>${s.t}</time><b>${s.title}</b>${s.now ? '<span class="now">NOW</span>' : "<span></span>"}</li>`
      ).join("");
    }

    function applyStill(ch) {
      const [c1, c2, c3] = ch.still;
      els.wash.style.background = `
        radial-gradient(ellipse 68% 52% at 64% 34%, ${c2}55, transparent 64%),
        radial-gradient(ellipse 42% 38% at 22% 62%, ${c3}22, transparent 70%),
        linear-gradient(122deg, ${c1} 0%, ${c2} 52%, ${c3}44 78%, #08090c 100%)
      `;
    }

    function selectChannel(id) {
      const ch = CHANNELS[id];
      if (!ch) return;
      selected = id;
      els.channel.textContent = ch.name;
      els.programme.textContent = ch.now;
      els.next.textContent = ch.next;
      els.remain.textContent = `${ch.remain} · ${ch.slot}`;
      els.meter.style.width = ch.progress + "%";
      applyStill(ch);
      paintTonight(ch);
      document.querySelectorAll(".card").forEach((n) => {
        const on = n.dataset.id === id;
        n.classList.toggle("is-selected", on);
        n.setAttribute("aria-current", on ? "true" : "false");
      });
      els.picture.classList.remove("is-cut");
      void els.picture.offsetWidth;
      els.picture.classList.add("is-cut");
      if (!playing) setPlaying(true);
      const card = els.film.querySelector(`.card[data-id="${id}"]`);
      if (card) card.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
    }

    function setPlaying(on) {
      playing = on;
      els.picture.classList.toggle("is-held", !on);
      els.play.classList.toggle("is-on", on);
      els.stop.classList.toggle("is-on", !on);
    }

    function setOpen(which) {
      const searchOn = which === "search";
      const sheetOn = which === "sheet";
      const any = searchOn || sheetOn;
      if (any) {
        els.veil.hidden = false;
        els.spot.hidden = !searchOn;
        els.sheet.hidden = !sheetOn;
        requestAnimationFrame(() => {
          els.veil.classList.toggle("is-on", any);
          els.spot.classList.toggle("is-on", searchOn);
          els.sheet.classList.toggle("is-on", sheetOn);
        });
      } else {
        els.spot.classList.remove("is-on");
        els.sheet.classList.remove("is-on");
        els.veil.classList.remove("is-on");
        const hide = () => {
          if (els.spot.classList.contains("is-on") || els.sheet.classList.contains("is-on")) return;
          els.spot.hidden = true;
          els.sheet.hidden = true;
          els.veil.hidden = true;
        };
        if (reduce) hide();
        else setTimeout(hide, 380);
      }
      if (searchOn) {
        lastFocus = document.activeElement;
        els.q.focus();
        renderSearch(els.q.value);
      } else if (sheetOn) {
        lastFocus = document.activeElement;
      } else if (lastFocus && typeof lastFocus.focus === "function") {
        lastFocus.focus();
        lastFocus = null;
      }
    }

    function renderSearch(raw) {
      const q = raw.trim().toLowerCase();
      if (!q) {
        els.hitsCh.innerHTML = '<p class="none">Begin with a name.</p>';
        els.hitsPg.innerHTML = '<p class="none">Programmes appear as you type.</p>';
        return;
      }
      let ch = SEARCH_CH.filter((x) => x.name.toLowerCase().includes(q) || x.meta.toLowerCase().includes(q));
      let pg = SEARCH_PG.filter((x) => x.name.toLowerCase().includes(q) || x.meta.toLowerCase().includes(q));
      if (q === "news") {
        ch = SEARCH_CH.filter((x) => x.id === "ch07" || x.id === "cnn" || x.id === "bbc");
        pg = SEARCH_PG.filter((x) => x.name === "Yle Uutiset" || x.name === "A-studio");
      }
      const hit = (x) => `<button class="hit" type="button" data-id="${x.id}"><span class="hit-name">${x.name}</span><span class="hit-meta">${x.meta}</span></button>`;
      els.hitsCh.innerHTML = ch.length ? ch.map(hit).join("") : '<p class="none">No channels in the house.</p>';
      els.hitsPg.innerHTML = pg.length ? pg.map(hit).join("") : '<p class="none">No programmes match.</p>';
    }

    function typing() {
      const t = document.activeElement;
      return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
    }

    els.film.addEventListener("click", (e) => {
      const card = e.target.closest(".card[data-id]");
      if (card) selectChannel(card.dataset.id);
    });

    document.querySelector(".chips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      group = chip.dataset.group;
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("is-on", c === chip));
      paintStrip();
    });

    els.play.addEventListener("click", () => setPlaying(true));
    els.stop.addEventListener("click", () => setPlaying(false));

    document.getElementById("open-search").addEventListener("click", () => setOpen("search"));
    document.getElementById("open-sources").addEventListener("click", () => setOpen("sheet"));
    els.veil.addEventListener("click", () => setOpen(null));
    els.q.addEventListener("input", () => renderSearch(els.q.value));

    els.spot.addEventListener("click", (e) => {
      const hit = e.target.closest(".hit");
      if (!hit) return;
      selectChannel(hit.dataset.id);
      setOpen(null);
    });

    document.getElementById("btn-replace").addEventListener("click", (e) => {
      e.currentTarget.textContent = "Replaced";
    });
    document.getElementById("btn-refresh").addEventListener("click", (e) => {
      e.currentTarget.textContent = "Fresh";
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && !typing()) {
        e.preventDefault();
        setOpen("search");
      }
      if ((e.key === "s" || e.key === "S") && !typing() && !els.spot.classList.contains("is-on")) {
        e.preventDefault();
        setOpen(els.sheet.classList.contains("is-on") ? null : "sheet");
      }
      if (e.key === "Escape") setOpen(null);
    });

    paintStrip();
    paintTonight(CHANNELS.ch07);
    applyStill(CHANNELS.ch07);
    els.meter.style.width = CHANNELS.ch07.progress + "%";
    const opening = els.film.querySelector(".card.is-selected");
    if (opening) opening.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" });
  </script>
