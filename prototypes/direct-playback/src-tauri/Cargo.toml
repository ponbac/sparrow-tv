[package]
name = "sparrow-direct-playback-prototype"
version = "0.1.0"
description = "Throwaway direct live playback comparison for Sparrow TV"
authors = ["ponbac"]
edition = "2021"

[lib]
name = "sparrow_direct_playback_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = "2.5.2"
