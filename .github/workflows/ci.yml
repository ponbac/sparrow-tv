name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "rewrite/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned repository tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.8.12
          sha256: f2092b1e67f0abc8803d3be120dd2bc5b656dd99680ba3159f710e149da10d05
          cache: false

      - name: Install Linux compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            lld \
            pkg-config

      - name: Run provider-free deterministic checks
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: just ci

