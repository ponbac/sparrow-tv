[package]
name = "sparrow-installed"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "sparrow-installed"

[features]
# Explicit opt-in for local packaged playback comparisons; never a release default.
linux-playback-lab = []

[lib]
name = "sparrow_installed"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sparrow-bounded-blocking = { path = "../../crates/sparrow-bounded-blocking" }
sparrow-client-contract = { path = "../../crates/sparrow-client-contract" }
sparrow-core = { path = "../../crates/sparrow-core" }
sparrow-installed-catalog = { path = "../../crates/sparrow-installed-catalog" }
sparrow-installed-playback = { path = "../../crates/sparrow-installed-playback" }
sparrow-source-http = { path = "../../crates/sparrow-source-http" }
tauri = { version = "=2.11.5", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.0"

[dev-dependencies]
sparrow-snapshot-store = { path = "../../crates/sparrow-snapshot-store" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
