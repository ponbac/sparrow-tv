[package]
name = "sparrow-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
sparrow-guide-ui = { path = "../sparrow-guide-ui", features = ["fixture"] }
sparrow-installed-catalog = { path = "../sparrow-installed-catalog" }
sparrow-tv-guide = { path = "../sparrow-tv-guide" }
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
