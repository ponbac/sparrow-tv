[package]
name = "sparrow-channel-icons"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
sha2 = "0.10"
tempfile = "3"
webpki-roots = "1"
gif = "0.14"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
