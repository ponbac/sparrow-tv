[package]
name = "sparrow-guide-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
fixture = ["dep:reqwest"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
image = { version = "0.25.10", default-features = false }
log = "0.4"
reqwest = { version = "0.13.4", optional = true }
sparrow-bounded-blocking = { path = "../sparrow-bounded-blocking" }
sparrow-channel-icons = { path = "../sparrow-channel-icons" }
sparrow-core = { path = "../sparrow-core" }
sparrow-installed-catalog = { path = "../sparrow-installed-catalog" }
sparrow-installed-playback = { path = "../sparrow-installed-playback" }
sparrow-tv-guide = { path = "../sparrow-tv-guide" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
