[package]
name = "sparrow-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chrono = "0.4"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sparrow-core = { path = "../sparrow-core" }
sparrow-source-http = { path = "../sparrow-source-http" }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
